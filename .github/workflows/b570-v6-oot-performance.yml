name: B570 V6 - OOT performance fork Intel Arc trial

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b570-v6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-v6:
    name: Build B570 V6 Windows x64 (experimental)
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PLATFORM: windows-x86_64
      SOURCE_SHA: f22ecc4ac784a4ce13fe72fb66ac78e86db0c01d

    steps:
      - name: Check out tested Ocarina performance fork at pinned commit
        uses: actions/checkout@v4
        with:
          repository: A-Man-With-A-Plan-dev/Eglantine
          ref: f22ecc4ac784a4ce13fe72fb66ac78e86db0c01d
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and record provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:SOURCE_SHA) {
              throw "Unexpected source revision: $actual (expected $env:SOURCE_SHA)"
          }
          foreach ($path in @('CMakeLists.txt', 'tools/windows/install-vulkan-sdk.ps1', '.github/actions/setup-build/action.yml')) {
              if (-not (Test-Path -LiteralPath $path)) { throw "Missing upstream build prerequisite: $path" }
          }
          @(
              'B570 V6 - EXPERIMENTAL OCARINA PERFORMANCE BUILD',
              'Source: https://github.com/A-Man-With-A-Plan-dev/Eglantine',
              'Pinned branch: stable/oot-playable-no-crash-2026-11-05',
              "Pinned source commit: $actual",
              'Original project: https://github.com/Djihads80/Eglantine',
              'Build target: Windows x64 / MSVC Release',
              'Known external testing: RTX 5090, Kokiri Forest 40-60 FPS (upstream report, not Intel Arc)',
              'Intel Arc B570: UNTESTED; graphical errors, crashes, and low FPS are possible',
              'No proprietary games, keys, or firmware included',
              'License: GPL-3.0-or-later; see linked source and upstream credit files'
          ) | Set-Content -LiteralPath 'B570-V6-MANIFEST.txt' -Encoding UTF8
          Write-Host "Validated performance fork source: $actual"

      - name: Preserve provenance even if compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B570-V6-source-report
          path: B570-V6-MANIFEST.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Configure upstream build metadata and caches
        uses: ./.github/actions/setup-build
        with:
          platform: windows-x86_64
          sha: f22ecc4ac784a4ce13fe72fb66ac78e86db0c01d
          refspec: b570-v6-oot-performance
          tag: b570-v6-intel-arc-experiment
          release: 'false'

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure Release build
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DNIGHTLY_BUILD=ON

      - name: Compile Windows executable
        shell: bash
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel 4

      - name: Package complete emulator and cache-safe launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'build/release/bin'
          $exe = Join-Path $bin 'eglantine.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Eglantine executable missing from build output.' }
          windeployqt --release --no-translations $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with code $LASTEXITCODE" }
          Copy-Item 'B570-V6-MANIFEST.txt' -Destination $bin -Force
          foreach ($doc in @('CREDITS_OOT.md', 'OOT_WORKFLOW.md', 'OOT_HELP_WANTED.md', 'LICENSE.md', 'LICENSE', 'COPYING')) {
              if (Test-Path -LiteralPath $doc) { Copy-Item -LiteralPath $doc -Destination $bin -Force }
          }

          $launcher = @'
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PSScriptRoot 'eglantine.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'eglantine.exe must be beside this launcher.' }
          if (Get-Process -Name eglantine -ErrorAction SilentlyContinue) {
              throw 'Close other Eglantine windows before starting V6. They share the shader cache.'
          }

          Write-Host 'B570 V6 - EXPERIMENTAL OOT PERFORMANCE FORK' -ForegroundColor Cyan
          Write-Host '1 - Source defaults (best initial performance/visual check)'
          Write-Host '2 - Disable GPU thread splitting (driver-crash stability check)'
          Write-Host '3 - Source defaults plus GPU profiling (slower; diagnostic only)'
          $mode = Read-Host 'Choose 1, 2, or 3 [default 1]'
          if ([string]::IsNullOrWhiteSpace($mode)) { $mode = '1' }
          if ($mode -notin @('1', '2', '3')) { throw "Unrecognized mode: $mode" }

          # Keep the source's other optimizations intact. Only change one option per test.
          Remove-Item Env:EDEN_NX2_SPLIT -ErrorAction SilentlyContinue
          Remove-Item Env:EDEN_NX2_GPU_PROFILE -ErrorAction SilentlyContinue
          Remove-Item Env:EDEN_NX2_TENSOR -ErrorAction SilentlyContinue
          Remove-Item Env:EDEN_NX2_FENCE_BATCH -ErrorAction SilentlyContinue
          if ($mode -eq '2') { $env:EDEN_NX2_SPLIT = '0' }
          if ($mode -eq '3') { $env:EDEN_NX2_GPU_PROFILE = '1' }

          $root = Join-Path $env:APPDATA 'eden\cache\shader'
          $title = '0400486024dec000'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $active = Join-Path $root $title
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss-fff'
          $backup = Join-Path $root "${title}_before_V6_$stamp"
          $trial = Join-Path $root "${title}_V6_mode${mode}_$stamp"
          $hadCache = Test-Path -LiteralPath $active
          if ($hadCache) {
              Move-Item -LiteralPath $active -Destination $backup -ErrorAction Stop
              Write-Host "Previous cache archived temporarily: $backup"
          }

          try {
              Write-Host "Launching V6 in mode $mode with a fresh cache."
              $p = Start-Process -FilePath $exe -WorkingDirectory $PSScriptRoot -Wait -PassThru
              Write-Host "Emulator exit code: $($p.ExitCode)"
          } finally {
              $reports = Join-Path $PSScriptRoot 'V6-Trial-Reports'
              New-Item -ItemType Directory -Force -Path $reports | Out-Null
              $log = Join-Path $env:APPDATA 'eden\log\eden_log.txt'
              if (Test-Path -LiteralPath $log) {
                  $logDest = Join-Path $reports "V6_mode${mode}_$stamp.txt"
                  Copy-Item -LiteralPath $log -Destination $logDest -Force
                  Write-Host "V6 log saved: $logDest"
              }
              if (Test-Path -LiteralPath $active) {
                  Move-Item -LiteralPath $active -Destination $trial -ErrorAction Stop
                  Write-Host "V6 cache preserved separately: $trial"
              }
              if ($hadCache -and (Test-Path -LiteralPath $backup)) {
                  Move-Item -LiteralPath $backup -Destination $active -ErrorAction Stop
                  Write-Host 'Pre-existing shader cache restored.'
              }
          }
          '@
          Set-Content -LiteralPath (Join-Path $bin 'Safe-Test-V6.ps1') -Value $launcher -Encoding UTF8
          @(
              '@echo off',
              'cd /d "%~dp0"',
              'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Safe-Test-V6.ps1"',
              'pause'
          ) | Set-Content -LiteralPath (Join-Path $bin 'Safe-Test-V6.cmd') -Encoding ASCII

      - name: Upload V6 Windows build
        uses: actions/upload-artifact@v4
        with:
          name: B570-V6-OOT-Performance-Windows-x64
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 30
