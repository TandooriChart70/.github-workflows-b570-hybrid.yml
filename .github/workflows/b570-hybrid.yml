
name: B570 Hybrid - fast Eglantine plus OOT rendering fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msvc:
    name: Build hybrid Windows x64 (experimental)
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      PLATFORM: windows-x86_64

    steps:
      - name: Check out upstream Eglantine source
        uses: actions/checkout@v4
        with:
          repository: Djihads80/Eglantine
          ref: nx2
          fetch-depth: 0
          persist-credentials: false

      - name: Apply OOT rendering fixes to fast baseline
        id: hybrid
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name 'B570 Hybrid Test Builder'
          git config user.email 'b570-hybrid-test@users.noreply.github.com'
          git config core.longpaths true

          Write-Host 'Checking out original fast Eglantine source...'
          git checkout --detach 70fa082312
          if ($LASTEXITCODE -ne 0) {
            throw 'Fast baseline commit could not be checked out.'
          }

          git switch -c b570-fast-base-with-oot-fixes
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create hybrid branch.'
          }

          Write-Host 'Fetching OOT rendering fixes...'
          git fetch origin '+refs/pull/614/head:refs/remotes/origin/oot-rendering'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch rendering fix PR 614.'
          }

          # Eleven rendering commits, oldest first.
          # Redundant patches are dropped automatically.
          $patches = @(
            '41e7291',
            '245d902',
            '2d29137',
            '502e6e2',
            'f918505',
            '8424eeb',
            '01783ce',
            'a6dea8a',
            'dc3e912',
            '8de2d42',
            'b536a97'
          )

          foreach ($sha in $patches) {
            Write-Host "Applying rendering patch $sha..."

            git cherry-pick -x --empty=drop $sha

            if ($LASTEXITCODE -ne 0) {
              Write-Host "Patch conflict at $sha" -ForegroundColor Red

              git status --short |
                Out-File -Encoding utf8 integration-conflicts.txt

              git diff --name-only --diff-filter=U |
                Out-File -Append -Encoding utf8 integration-conflicts.txt

              throw "Integration failed at patch $sha. Check build log."
            }
          }

          $rev = (git rev-parse HEAD).Trim()

          "sha=$rev" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          @(
            'EGLANTINE B570 HYBRID - EXPERIMENTAL'
            'Fast baseline: 70fa082312'
            'Startup fix: existing baseline changes preserved'
            'Rendering changes: PR 614'
            'Redundant patches automatically dropped'
            "Built source HEAD: $rev"
            'Target: Windows x64 MSVC'
            'Not yet gameplay verified'
            'No game ROMs, firmware, saves, or keys included'
            ''
            'Source history:'
          ) | Out-File -Encoding utf8 HYBRID-MANIFEST.txt

          git log --format='%h %s' -14 |
            Out-File -Append -Encoding utf8 HYBRID-MANIFEST.txt

          git diff --stat 70fa082312 HEAD |
            Out-File -Append -Encoding utf8 HYBRID-MANIFEST.txt

          Write-Host 'Source integration completed.'

      - name: Preserve integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-integration-report
          path: |
            HYBRID-MANIFEST.txt
            integration-conflicts.txt
          if-no-files-found: ignore

      - name: Set up Eglantine build metadata and caches
        uses: Djihads80/Eglantine/.github/actions/setup-build@5016e217b829b45fda263b05ee00560bd3656397
        with:
          platform: windows-x86_64
          sha: ${{ steps.hybrid.outputs.sha }}
          refspec: b570-fastbase-oot-pr614
          tag: b570-hybrid-experimental
          release: 'false'

      - name: Enable Visual Studio MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure Windows build
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DNIGHTLY_BUILD=ON

      - name: Compile hybrid Windows emulator
        shell: bash
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel 4

      - name: Package DLLs and source provenance
        shell: pwsh
        run: |
          if (-not (Test-Path build/release/bin/eglantine.exe)) {
            throw 'Build failed: eglantine.exe was not produced.'
          }

          windeployqt --release --no-translations build/release/bin/eglantine.exe

          if ($LASTEXITCODE -ne 0) {
            throw 'Qt packaging failed.'
          }

          Copy-Item HYBRID-MANIFEST.txt build/release/bin/

      - name: Upload hybrid Windows build
        uses: actions/upload-artifact@v4
        with:
          name: B570-Eglantine-Hybrid-Windows-x64
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7
