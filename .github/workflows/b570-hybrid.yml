name: B570 Hybrid - fast Eglantine plus OOT rendering fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msvc:
    name: Build hybrid Windows x64 (experimental)
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PLATFORM: windows-x86_64
    steps:
      - name: Check out upstream Eglantine source
        uses: actions/checkout@v4
        with:
          repository: Djihads80/Eglantine
          ref: nx2
          fetch-depth: 0
          persist-credentials: false

      - name: Apply startup and rendering fixes to exact fast-build source
        id: hybrid
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'B570 Hybrid Test Builder'
          git config user.email 'b570-hybrid-test@users.noreply.github.com'
          git config core.longpaths true
          # 70fa082312 is the exact source commit behind the user's fast
          # branch-switchbrew-names-736c1d29 release (not the release tag hash).
          git checkout --detach 70fa082312
          if ($LASTEXITCODE -ne 0) { throw 'Fast baseline commit 70fa082312 cannot be checked out.' }
          git switch -c b570-fast-base-with-oot-fixes
          if ($LASTEXITCODE -ne 0) { throw 'Could not create integration branch.' }
          # Fetch PR heads by GitHub pull-request ref: no temporary release URLs.
          git fetch origin '+refs/pull/567/head:refs/remotes/origin/oot-wait64'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch startup fix PR 567.' }
          git fetch origin '+refs/pull/614/head:refs/remotes/origin/oot-rendering'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch rendering fix PR 614.' }
          # Exact source commits: WaitIfEqual64 then PR #614's 11 commits, oldest first.
          $patches = @(
            'e736dfde9e',
            '41e7291', '245d902', '2d29137', '502e6e2',
            'f918505', '8424eeb', '01783ce', 'a6dea8a',
            'dc3e912', '8de2d42', 'b536a97'
          )
          foreach ($sha in $patches) {
            Write-Host "Applying $sha..."
            git cherry-pick -x $sha
            if ($LASTEXITCODE -ne 0) {
              git status --short | Out-File -Encoding utf8 integration-conflicts.txt
              git diff --name-only --diff-filter=U | Out-File -Append -Encoding utf8 integration-conflicts.txt
              throw "Source integration conflict at $sha. This is NOT a successful hybrid; see the build log."
            }
          }
          $rev = (git rev-parse HEAD).Trim()
          "sha=$rev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          @(
            'Eglantine B570 SOURCE HYBRID - EXPERIMENTAL, NOT GAMEPLAY VERIFIED',
            'Fast baseline: Djihads80/Eglantine@70fa082312',
            'Startup patch: e736dfde9e (PR #567)',
            'Rendering patchset: PR #614, all 11 commits',
            "Built source HEAD: $rev",
            'Compiler target: MSVC / Windows x64',
            'No proprietary firmware, game ROMs, keys or saves included',
            '',
            'Source history:'
          ) | Out-File -Encoding utf8 HYBRID-MANIFEST.txt
          git log --format='%h %s' -14 | Out-File -Append -Encoding utf8 HYBRID-MANIFEST.txt
          git diff --stat 70fa082312 HEAD | Out-File -Append -Encoding utf8 HYBRID-MANIFEST.txt

      - name: Preserve manifest even when later compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-integration-report
          path: |
            HYBRID-MANIFEST.txt
            integration-conflicts.txt
          if-no-files-found: ignore

      - name: Set up Eglantine build metadata and caches
        uses: Djihads80/Eglantine/.github/actions/setup-build@5016e217b829b45fda263b05ee00560bd3656397
        with:
          platform: windows-x86_64
          sha: ${{ steps.hybrid.outputs.sha }}
          refspec: b570-fastbase-oot-pr614
          tag: b570-hybrid-experimental
          release: 'false'

      - name: Enable Visual Studio MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure Windows build
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DNIGHTLY_BUILD=ON

      - name: Compile hybrid Windows emulator
        shell: bash
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel 4

      - name: Package DLLs and source provenance
        shell: pwsh
        run: |
          if (-not (Test-Path build/release/bin/eglantine.exe)) {
            throw 'Build failed: no eglantine.exe.'
          }
          windeployqt --release --no-translations build/release/bin/eglantine.exe
          Copy-Item HYBRID-MANIFEST.txt build/release/bin/

      - name: Download hybrid Windows build
        uses: actions/upload-artifact@v4
        with:
          name: B570-Eglantine-Hybrid-Windows-x64
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7
