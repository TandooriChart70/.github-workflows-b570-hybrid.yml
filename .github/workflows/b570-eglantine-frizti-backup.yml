
name: B570 Backup - Eglantine plus Frizti Performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build B570 Frizti Backup
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      PLATFORM: windows-x86_64

    steps:
      - name: Checkout Eglantine source
        uses: actions/checkout@v4
        with:
          repository: Djihads80/Eglantine
          ref: nx2
          fetch-depth: 0
          persist-credentials: false

      - name: Create hybrid source
        id: hybrid
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name 'B570 Hybrid Builder'
          git config user.email 'b570-builder@users.noreply.github.com'
          git config core.longpaths true

          Write-Host 'Loading original fast Eglantine...'

          git checkout --detach 70fa082312
          if ($LASTEXITCODE -ne 0) {
            throw 'Original fast source unavailable.'
          }

          git switch -c b570-frizti-backup
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create backup branch.'
          }

          Write-Host 'Fetching Zelda rendering corrections...'

          git fetch origin '+refs/pull/614/head:refs/remotes/origin/oot-rendering'
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot fetch Eglantine rendering fixes.'
          }

          $renderPatches = @(
            '41e7291',
            '245d902',
            '2d29137',
            '502e6e2',
            'f918505',
            '8424eeb',
            '01783ce',
            'a6dea8a',
            'dc3e912',
            '8de2d42',
            'b536a97'
          )

          foreach ($sha in $renderPatches) {
            Write-Host "Applying Zelda fix $sha"

            git cherry-pick -x --empty=drop $sha

            if ($LASTEXITCODE -ne 0) {
              git status --short |
                Out-File -Encoding utf8 integration-conflicts.txt

              throw "Required rendering fix failed: $sha"
            }
          }

          $renderRev = (git rev-parse HEAD).Trim()

          Write-Host 'Zelda rendering fixes integrated.'

          Write-Host 'Fetching selected Lichii and Frizti improvements...'

          git remote add lichii https://github.com/zortos293/Lichii.git

          git fetch --no-tags lichii '+refs/pull/175/head:refs/remotes/lichii/pr175'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Lichii PR 175.'
          }

          git fetch --no-tags lichii '+refs/pull/176/head:refs/remotes/lichii/pr176'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Lichii PR 176.'
          }

          git fetch --no-tags lichii '+refs/pull/194/head:refs/remotes/lichii/frizti-port'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Frizti integration PR 194.'
          }

          $extraPatches = @(
            @{
              Label = 'Lichii storage buffer cache'
              Ref = 'refs/remotes/lichii/pr175'
            },
            @{
              Label = 'Lichii uniform bank uploads'
              Ref = 'refs/remotes/lichii/pr176'
            },
            @{
              Label = 'Frizti port preflush caching'
              Ref = '9218296'
            },
            @{
              Label = 'Frizti port constant buffer page limit'
              Ref = 'bfc3eb5'
            }
          )

          $applied = @()
          $skipped = @()

          foreach ($patch in $extraPatches) {
            $reference = $patch.Ref

            $sha = (git rev-parse --verify "$reference^{commit}" 2>$null)

            if ($LASTEXITCODE -ne 0) {
              Write-Host "Unavailable: $($patch.Label)"
              $skipped += "$($patch.Label): unavailable"
              continue
            }

            $sha = $sha.Trim()
            $before = (git rev-parse HEAD).Trim()

            Write-Host "Testing $($patch.Label)..."

            git cherry-pick -x --empty=drop $sha

            if ($LASTEXITCODE -eq 0) {
              $after = (git rev-parse HEAD).Trim()

              if ($after -ne $before) {
                Write-Host "Applied: $($patch.Label)"
                $applied += $patch.Label
              } else {
                Write-Host "Already present: $($patch.Label)"
                $skipped += "$($patch.Label): already present"
              }

              continue
            }

            Write-Host "Skipping incompatible change: $($patch.Label)"

            $skipped += "$($patch.Label): cherry-pick failed"

            git cherry-pick --abort

            if ($LASTEXITCODE -ne 0) {
              throw "Could not safely abort patch: $($patch.Label)"
            }

            $clean = @(git status --porcelain)

            if ($clean.Count -ne 0) {
              throw 'Working tree not clean after aborted patch.'
            }
          }

          @(
            'B570 Frizti Backup Integration'
            ''
            'Successfully applied:'
            $applied
            ''
            'Skipped:'
            $skipped
          ) | Out-File -Encoding utf8 integration-report.txt

          if ($applied.Count -eq 0) {
            throw 'No compatible additional performance patches applied. Backup build stopped.'
          }

          $rev = (git rev-parse HEAD).Trim()

          "sha=$rev" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          @(
            'B570 EGLANTINE FRIZTI BACKUP'
            'Experimental, not gameplay verified'
            'Original fast Eglantine: 70fa082312'
            'Zelda rendering corrections: PR 614'
            "Rendering baseline: $renderRev"
            "Backup source: $rev"
            "Additional changes applied: $($applied.Count)"
            ''
            'Applied changes:'
            $applied
            ''
            'Skipped changes:'
            $skipped
            ''
            'No game, firmware or keys included'
          ) | Out-File -Encoding utf8 HYBRID-MANIFEST.txt

          git diff --stat $renderRev HEAD |
            Out-File -Append -Encoding utf8 HYBRID-MANIFEST.txt

          Write-Host 'Hybrid source integration finished.'

      - name: Save integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B570-Frizti-Integration-Report
          path: |
            HYBRID-MANIFEST.txt
            integration-report.txt
            integration-conflicts.txt
          if-no-files-found: ignore

      - name: Setup Eglantine build
        uses: Djihads80/Eglantine/.github/actions/setup-build@5016e217b829b45fda263b05ee00560bd3656397
        with:
          platform: windows-x86_64
          sha: ${{ steps.hybrid.outputs.sha }}
          refspec: b570-frizti-experimental
          tag: b570-frizti-test
          release: 'false'

      - name: Enable Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure emulator
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DNIGHTLY_BUILD=ON

      - name: Compile B570 backup emulator
        shell: bash
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel 4

      - name: Package Windows emulator
        shell: pwsh
        run: |
          $exe = 'build/release/bin/eglantine.exe'

          if (-not (Test-Path $exe)) {
            throw 'Compilation did not produce eglantine.exe.'
          }

          windeployqt --release --no-translations $exe

          if ($LASTEXITCODE -ne 0) {
            throw 'Qt deployment failed.'
          }

          Copy-Item HYBRID-MANIFEST.txt build/release/bin/
          Copy-Item integration-report.txt build/release/bin/

          Write-Host 'Windows package ready.'

      - name: Upload backup emulator
        uses: actions/upload-artifact@v4
        with:
          name: B570-Eglantine-Frizti-Backup-Windows-x64
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7
