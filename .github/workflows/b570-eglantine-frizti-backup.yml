
name: B570 Backup - Fast Eglantine plus scoped Frizti changes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msvc:
    name: Build Eglantine-Frizti backup (experimental)
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      PLATFORM: windows-x86_64

    steps:
      - name: Check out Eglantine source
        uses: actions/checkout@v4
        with:
          repository: Djihads80/Eglantine
          ref: nx2
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate original fast source, rendering fix, and scoped Frizti changes
        id: hybrid
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'B570 Experimental Test Builder'
          git config user.email 'b570-experimental-test@users.noreply.github.com'
          git config core.longpaths true

          # Original fast Eglantine baseline.
          git checkout --detach 70fa082312
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot check out original fast source.'
          }

          git switch -c b570-frizti-backup
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create experimental branch.'
          }

          # Apply OoT rendering fixes from Hybrid V1.
          git fetch origin '+refs/pull/614/head:refs/remotes/origin/oot-rendering'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Eglantine PR 614.'
          }

          $renderPatches = @(
            '41e7291',
            '245d902',
            '2d29137',
            '502e6e2',
            'f918505',
            '8424eeb',
            '01783ce',
            'a6dea8a',
            'dc3e912',
            '8de2d42',
            'b536a97'
          )

          foreach ($sha in $renderPatches) {
            Write-Host "Rendering patch: $sha"
            git cherry-pick -x --empty=drop $sha

            if ($LASTEXITCODE -ne 0) {
              git status --short |
                Out-File -Encoding utf8 integration-conflicts.txt

              git diff --name-only --diff-filter=U |
                Out-File -Append -Encoding utf8 integration-conflicts.txt

              throw "Rendering integration failed at $sha."
            }
          }

          $renderRev = (git rev-parse HEAD).Trim()

          # Fetch selected Lichii optimizations.
          git remote add lichii https://github.com/zortos293/Lichii.git

          git fetch --no-tags lichii '+refs/pull/175/head:refs/remotes/lichii/storage-buffer-cache'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Lichii PR 175.'
          }

          git fetch --no-tags lichii '+refs/pull/176/head:refs/remotes/lichii/native-uniform-bank'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Lichii PR 176.'
          }

          # Fetch Frizti V2 source.
          git remote add frizti https://github.com/Frizti/Lichii.git

          git fetch --no-tags frizti '+refs/tags/frizti-v2:refs/tags/frizti-v2-test'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch Frizti V2 tag.'
          }

          $friztiHead = (git rev-parse 'refs/tags/frizti-v2-test').Trim()
          Write-Host "Frizti release source: $friztiHead"

          # Apply selected performance patches.
          $extraPatches = @(
            @{
              Label='Lichii PR 175: SSBO cache'
              Ref='refs/remotes/lichii/storage-buffer-cache'
            },
            @{
              Label='Lichii PR 176: uniform banks'
              Ref='refs/remotes/lichii/native-uniform-bank'
            },
            @{
              Label='Frizti V2: Dynamic FPS'
              Ref='765659a'
            }
          )

          foreach ($patch in $extraPatches) {
            $sha = (git rev-parse $patch.Ref).Trim()

            if ($LASTEXITCODE -ne 0) {
              throw "Cannot find $($patch.Label)."
            }

            Write-Host "Trying $($patch.Label) ($sha)"

            git cherry-pick -x --empty=drop $sha

            if ($LASTEXITCODE -ne 0) {
              git status --short |
                Out-File -Encoding utf8 integration-conflicts.txt

              git diff --name-only --diff-filter=U |
                Out-File -Append -Encoding utf8 integration-conflicts.txt

              throw "Source conflict applying $($patch.Label)."
            }
          }

          $rev = (git rev-parse HEAD).Trim()

          if ($rev -eq $renderRev) {
            throw 'No Frizti-related changes applied.'
          }

          "sha=$rev" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          @(
            'EXPERIMENTAL B570 BACKUP'
            'Original fast Eglantine: 70fa082312'
            'OoT rendering: Eglantine PR 614'
            'Lichii optimizations: PR 175 and PR 176'
            'Frizti Dynamic FPS: 765659a'
            "Frizti V2 source: $friztiHead"
            "Hybrid V1 source: $renderRev"
            "Backup source: $rev"
            'Not gameplay verified'
            'No game, firmware, saves or keys included'
            ''
            'Recent source history:'
          ) | Out-File -Encoding utf8 HYBRID-MANIFEST.txt

          git log --format='%h %s' -16 |
            Out-File -Append -Encoding utf8 HYBRID-MANIFEST.txt

          git diff --stat $renderRev HEAD |
            Out-File -Append -Encoding utf8 HYBRID-MANIFEST.txt

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B570-Frizti-Backup-Integration-Report
          path: |
            HYBRID-MANIFEST.txt
            integration-conflicts.txt
          if-no-files-found: ignore

      - name: Set up Eglantine build metadata
        uses: Djihads80/Eglantine/.github/actions/setup-build@5016e217b829b45fda263b05ee00560bd3656397
        with:
          platform: windows-x86_64
          sha: ${{ steps.hybrid.outputs.sha }}
          refspec: b570-fast-eglantine-plus-frizti
          tag: b570-frizti-backup-experimental
          release: 'false'

      - name: Enable Visual Studio MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure Windows build
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DNIGHTLY_BUILD=ON

      - name: Compile backup Windows emulator
        shell: bash
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel 4

      - name: Package DLLs and manifest
        shell: pwsh
        run: |
          if (-not (Test-Path build/release/bin/eglantine.exe)) {
            throw 'No eglantine.exe produced.'
          }

          windeployqt --release --no-translations build/release/bin/eglantine.exe

          if ($LASTEXITCODE -ne 0) {
            throw 'Qt packaging failed.'
          }

          Copy-Item HYBRID-MANIFEST.txt build/release/bin/

      - name: Upload B570 backup emulator
        uses: actions/upload-artifact@v4
        with:
          name: B570-Eglantine-Frizti-Backup-Windows-x64
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7
