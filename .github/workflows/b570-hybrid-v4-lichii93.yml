
name: B570 Hybrid V4 - Eglantine plus real Lichii 93 fixes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile V4 Windows x64 (experimental)
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PLATFORM: windows-x86_64

    steps:
      - name: Check out Eglantine source
        uses: actions/checkout@v4
        with:
          repository: Djihads80/Eglantine
          ref: nx2
          fetch-depth: 0
          persist-credentials: false

      - name: Combine fast Eglantine and real Build 93 commits
        id: hybrid
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'B570 Hybrid Builder'
          git config user.email 'b570-hybrid@users.noreply.github.com'
          git config core.longpaths true

          # Exact fast source used by the successful V1 build.
          git checkout --detach 70fa082312
          if ($LASTEXITCODE -ne 0) { throw 'Fast baseline unavailable.' }
          git switch -c b570-v4-lichii93-corrected
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create integration branch.' }

          # Keep the same black-scene fixes as V1.
          git fetch origin '+refs/pull/614/head:refs/remotes/origin/oot-rendering'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch Eglantine PR 614.' }

          $required = @(
            '41e7291', '245d902', '2d29137', '502e6e2',
            'f918505', '8424eeb', '01783ce', 'a6dea8a',
            'dc3e912', '8de2d42', 'b536a97'
          )

          foreach ($sha in $required) {
            Write-Host "Applying V1 rendering fix $sha"
            git cherry-pick -x --empty=drop $sha
            if ($LASTEXITCODE -ne 0) {
              throw "Required Eglantine fix failed: $sha"
            }
          }

          $v1rev = (git rev-parse HEAD).Trim()

          # Build 93's verified release commit.
          git remote add lichii https://github.com/zortos293/Lichii.git
          if ($LASTEXITCODE -ne 0) { throw 'Cannot add Lichii source.' }

          git fetch --no-tags lichii '+refs/tags/build-93:refs/tags/b570-lichii93-test'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch Lichii Build 93.' }

          $release = (git rev-parse 'refs/tags/b570-lichii93-test^{commit}').Trim()

          if ($LASTEXITCODE -ne 0 -or -not $release.StartsWith('09b78bd')) {
            throw "Unexpected Build 93 revision: $release"
          }

          Write-Host "Verified Build 93 commit: $release"

          # Actual Build 93 source changes.
          # Test performance and rendering patches individually.
          $candidates = @(
            @{
              Sha='5b89a3d'
              Label='Preserve occlusion queries across Vulkan submits'
            },
            @{
              Sha='7c0b5e7'
              Label='Cache continuous GPU buffer ranges'
            },
            @{
              Sha='27226d2'
              Label='Skip overwritten render-target uploads'
            },
            @{
              Sha='f356d39'
              Label='Additional Ocarina shader forms'
            }
          )

          $applied = [System.Collections.Generic.List[string]]::new()
          $skipped = [System.Collections.Generic.List[string]]::new()

          foreach ($item in $candidates) {
            $sha = $item.Sha
            $label = $item.Label

            # Verify that this commit belongs to Build 93.
            git merge-base --is-ancestor $sha $release

            if ($LASTEXITCODE -ne 0) {
              $skipped.Add("${sha}: not in Build 93")
              continue
            }

            $before = (git rev-parse HEAD).Trim()

            Write-Host "Trying ${sha}: $label"

            git cherry-pick -x --empty=drop $sha

            if ($LASTEXITCODE -eq 0) {
              $after = (git rev-parse HEAD).Trim()

              if ($after -ne $before) {
                $applied.Add("${sha}: $label")
              } else {
                $skipped.Add("${sha}: already present")
              }
            } else {
              Write-Host "Skipping incompatible change $sha"

              git cherry-pick --abort

              if ($LASTEXITCODE -ne 0) {
                throw "Could not abort $sha"
              }

              $pending = @(git status --porcelain)

              if ($pending.Count -gt 0) {
                throw "Unclean repository after $sha"
              }

              $skipped.Add("${sha}: source conflict")
            }
          }

          $revision = (git rev-parse HEAD).Trim()

          @(
            'B570 V4 - EXPERIMENTAL (NOT GAMEPLAY TESTED)',
            'Base Eglantine: 70fa082312',
            "Eglantine V1 rendering source: $v1rev",
            "Pinned Lichii Build 93: $release",
            "Hybrid source: $revision",
            '',
            'Actually applied:',
            ($applied | Out-String),
            'Skipped:',
            ($skipped | Out-String),
            'Game files, encryption keys, saves and firmware are not included.'
          ) | Out-File -Encoding utf8 B570-V4-MANIFEST.txt

          git diff --stat $v1rev HEAD |
            Out-File -Append -Encoding utf8 B570-V4-MANIFEST.txt

          if ($applied.Count -eq 0) {
            throw 'No additional Build 93 changes applied; refusing to relabel V1 as V4.'
          }

          git diff --check $v1rev HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Diff check failed.'
          }

          $status = @(git status --porcelain)

          if ($status.Count -ne 1 -or $status[0] -ne '?? B570-V4-MANIFEST.txt') {
            git status --short
            throw 'Unexpected working tree modifications.'
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=$revision" -Encoding utf8

          Write-Host "V4 integration complete: $($applied.Count) new patch(es)."

      - name: Upload source report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B570-V4-integration-report
          path: B570-V4-MANIFEST.txt
          if-no-files-found: ignore

      - name: Set up Eglantine build
        uses: Djihads80/Eglantine/.github/actions/setup-build@5016e217b829b45fda263b05ee00560bd3656397
        with:
          platform: windows-x86_64
          sha: ${{ steps.hybrid.outputs.sha }}
          refspec: b570-v4-lichii93-fixed
          tag: b570-v4-lichii93-test
          release: 'false'

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure Windows build
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DNIGHTLY_BUILD=ON

      - name: Compile and save error log
        shell: bash
        run: |
          set -o pipefail
          cmake --build build/release --target yuzu yuzu-cmd --parallel 4 2>&1 | tee b570-v4-compile.log

      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B570-V4-compile-log
          path: b570-v4-compile.log
          if-no-files-found: ignore

      - name: Package emulator
        shell: pwsh
        run: |
          $exe = 'build/release/bin/eglantine.exe'

          if (-not (Test-Path $exe)) {
            throw 'No eglantine.exe was produced.'
          }

          windeployqt --release --no-translations $exe

          if ($LASTEXITCODE -ne 0) {
            throw 'Qt deployment failed.'
          }

          Copy-Item B570-V4-MANIFEST.txt build/release/bin/

      - name: Upload V4 emulator
        uses: actions/upload-artifact@v4
        with:
          name: B570-Hybrid-V4-Lichii93-Windows-x64
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7
