name: B570 V9-V13 - Original daily OOT isolated shader experiments

on:
  push:
    paths:
      - '.github/workflows/b570-v9-v13-variants.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b570-v9-v13-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build B570 ${{ matrix.version }} original-daily renderer
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: V9
            features: isetp,gather
          - version: V10
            features: isetp,scratch
          - version: V11
            features: isetp,reduction
          - version: V12
            features: isetp,shift
          - version: V13
            features: isetp,gather,scratch,reduction,shift
    env:
      TEST_VERSION: ${{ matrix.version }}
      FEATURES: ${{ matrix.features }}
      PLATFORM: windows-x86_64
      BASE_SHA: e736dfde9e
      PATCH_SOURCE_SHA: f22ecc4ac784a4ce13fe72fb66ac78e86db0c01d

    steps:
      - name: Check out exact November 5 original daily source
        uses: actions/checkout@v4
        with:
          repository: Djihads80/Eglantine
          ref: nx2
          fetch-depth: 0
          persist-credentials: false

      - name: Apply verified isolated shader modifications to original daily source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse --short=10 HEAD)" = "e736dfde9e"
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import os

          path = Path("src/shader_recompiler/frontend/ampere/lower_to_maxwell.h")
          original = path.read_text(encoding="utf-8")
          sha = os.environ["PATCH_SOURCE_SHA"]
          version = os.environ["TEST_VERSION"]
          features = os.environ["FEATURES"].split(",")
          url = ("https://raw.githubusercontent.com/A-Man-With-A-Plan-dev/Eglantine/"
                 + sha + "/" + path.as_posix())
          with urlopen(url, timeout=90) as response:
              upstream = response.read().decode("utf-8")
          markers = {
              "isetp": ("            if (!floating && insn.Bits(72, 1)) {",
                        "            const u32 a = operand(0, floating), b = operand(1, floating);",
                        "const u32 accumulate = insn.Bits(87, 4)"),
              "gather": ("        case 0xb63: case 0xf63: {",
                         "        case 0xb60: case 0xf60: case 0x361: {",
                         "const u32 offset_mode = insn.Bits(76, 2)"),
              "scratch": ("inline RegisterPressure PrepareRegisterPressure(",
                          "// Lower only operations whose semantics",
                          "case 0x321: operand(16, input.Bits(74, 2) + 1)"),
              "reduction": ("        case 0x98e: {",
                            "        case 0x2bd:",
                            "const u32 type = insn.Bits(73, 3)"),
              "shift": ("        case 0x819: {",
                        "        case 0xa11: {",
                        "SHF.R.U64 funnel")
          }
          expected = {
              "V9": ["isetp", "gather"],
              "V10": ["isetp", "scratch"],
              "V11": ["isetp", "reduction"],
              "V12": ["isetp", "shift"],
              "V13": ["isetp", "gather", "scratch", "reduction", "shift"]
          }
          if features != expected.get(version):
              raise RuntimeError(f"Unexpected feature matrix: {version}: {features}")

          def block(source, a, b, label):
              if source.count(a) != 1:
                  raise RuntimeError(f"{label}: start marker is missing or duplicated: {a}")
              begin = source.index(a)
              stop = source.find(b, begin + len(a))
              if stop < begin:
                  raise RuntimeError(f"{label}: end marker missing: {b}")
              return source[begin:stop]

          result = original
          for feature in features:
              a, b, proof = markers[feature]
              old = block(result, a, b, "original")
              new = block(upstream, a, b, "pinned reference")
              if old == new or proof not in new:
                  raise RuntimeError(f"{feature}: unexpected patch input, refusing to build")
              result = result.replace(old, new, 1)
              print(f"{version}: applied {feature}, {len(old)} -> {len(new)} bytes")

          if result == original:
              raise RuntimeError("No source changes made")
          path.write_text(result, encoding="utf-8", newline="\n")
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/shader_recompiler/frontend/ampere/lower_to_maxwell.h"
          git diff --stat
          {
            echo "B570 $TEST_VERSION - ORIGINAL DAILY + ISOLATED SHADER FIXES"
            echo 'EXPERIMENTAL: NOT VERIFIED IN GAME ON INTEL ARC B570'
            echo "Daily baseline: Djihads80/Eglantine $(git rev-parse HEAD)"
            echo "Shader reference: A-Man-With-A-Plan-dev/Eglantine $PATCH_SOURCE_SHA"
            echo "Shader changes: $FEATURES"
            echo 'Original MSVC, Qt 6.8.3, AV1-capable FFmpeg'
            echo 'Launcher: EDEN_NX2_SPLIT=0 and separate per-build shader cache'
            echo 'User game files, firmware, and saves are NOT included or modified'
            echo 'Build success does not mean visible 3D or controllable gameplay passed'
            git diff --stat
          } > B570-EXPERIMENT-MANIFEST.txt

      - name: Prove AV1-enabled FFmpeg is selected for MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffmpeg = Get-Content 'externals/ffmpeg/CMakeLists.txt' -Raw
          if ($ffmpeg -notmatch 'if \(\(MSVC OR LINUX\) AND CPMUTIL_AMD64\)' -or
              $ffmpeg -notmatch 'AddJsonPackage\(ffmpeg-ci-av1\)') {
            throw 'AV1-enabled Windows FFmpeg dependency not configured; fail closed'
          }
          Write-Host 'Bundled AV1 source configuration verified.'

      - name: Record manifest even if compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B570-${{ matrix.version }}-source-report
          path: B570-EXPERIMENT-MANIFEST.txt
          if-no-files-found: ignore

      - name: Configure original daily build metadata and dependencies
        uses: ./.github/actions/setup-build
        with:
          platform: windows-x86_64
          sha: e736dfde9e
          refspec: b570-${{ matrix.version }}-original-daily
          tag: b570-${{ matrix.version }}-shader-test
          release: 'false'

      - name: Enable MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.8.3 (same as original daily)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure MSVC Release
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DNIGHTLY_BUILD=ON

      - name: Compile emulator GUI and CLI (retry once on failure)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Attempt $attempt/2 for $TEST_VERSION"
            if cmake --build build/release --target yuzu yuzu-cmd --parallel 4; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Both build attempts failed. No emulator will be published."
              exit 1
            fi
            sleep 20
          done

      - name: Package variant with safe gameplay test and automatic logs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'build/release/bin'
          $exe = Join-Path $bin 'eglantine.exe'
          if (-not (Test-Path $exe)) { throw 'Compilation did not produce eglantine.exe' }
          windeployqt --release --no-translations $exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt dependency packaging failed' }
          Copy-Item B570-EXPERIMENT-MANIFEST.txt -Destination $bin -Force
          @(
            'This is an EXPERIMENTAL build, not verified to run Zelda gameplay.'
            'Use the version-matched Safe-Test-VXX.cmd, close the GUI when done.'
            'Original daily baseline: e736dfde9e with EDEN_NX2_SPLIT=0.'
            'V8: ISETP.EX comparisons.'
            'V9: ISETP.EX and texture gathers.'
            'V10: ISETP.EX and scratch register lowering.'
            'V11: ISETP.EX and compute reductions.'
            'V12: ISETP.EX and 64-bit funnel shifts.'
            'V13: all five shader changes combined.'
            "Version: $($env:TEST_VERSION)"
            "Features: $($env:FEATURES)"
            'Close all other Eglantine windows first.'
            'Compare whether 3D appears, if Link moves, and FPS stopped/moving.'
            'Share the automatically saved report after closing the emulator.'
            'No games, firmware, keys, or saves included.'
          ) | Set-Content -Path (Join-Path $bin 'README-OOT-TESTS.txt') -Encoding UTF8

          $launcher = @'
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PSScriptRoot 'eglantine.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Missing eglantine.exe beside test script' }
          if (Get-Process -Name eglantine -ErrorAction SilentlyContinue) {
              throw 'Close every Eglantine instance first: all builds share the Eden config/cache.'
          }
          $env:EDEN_NX2_SPLIT = '0'
          Remove-Item Env:EDEN_NX2_TENSOR -ErrorAction SilentlyContinue
          Remove-Item Env:EDEN_NX2_FENCE_BATCH -ErrorAction SilentlyContinue

          # Isolate __VERSION__ shader cache from the working original; preserve cache between __VERSION__ runs.
          $root = Join-Path $env:APPDATA 'eden\cache\shader'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $id = '0400486024dec000'
          $active = Join-Path $root $id
          $v8 = Join-Path $root "$($id)___VERSION___isetp_persistent"
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss-fff'
          $backup = Join-Path $root "$($id)_before___VERSION___$stamp"
          $hadOriginal = Test-Path -LiteralPath $active
          if ($hadOriginal) { Move-Item -LiteralPath $active -Destination $backup -ErrorAction Stop }
          try {
              if (Test-Path -LiteralPath $v8) { Move-Item -LiteralPath $v8 -Destination $active -ErrorAction Stop }
              Write-Host '__VERSION__ targeted ISETP shader experiment - NOT yet verified in game' -ForegroundColor Cyan
              Write-Host 'Start Zelda in GUI and test whether Link + the 3D world appear.'
              Write-Host 'When finished, close Eglantine normally; a report is captured automatically.'
              $p = Start-Process -FilePath $exe -WorkingDirectory $PSScriptRoot -PassThru -Wait
              Write-Host "Exit code: $($p.ExitCode)"
          } finally {
              $reports = Join-Path $PSScriptRoot '__VERSION__-Trial-Reports'
              New-Item -ItemType Directory -Path $reports -Force | Out-Null
              $log = Join-Path $env:APPDATA 'eden\log\eden_log.txt'
              if (Test-Path -LiteralPath $log) {
                  try {
                      $read = [System.IO.File]::Open($log, 'Open', 'Read', 'ReadWrite')
                      try {
                          $write = [System.IO.File]::Create((Join-Path $reports "__VERSION___$stamp.txt"))
                          try { $read.CopyTo($write) } finally { $write.Dispose() }
                      } finally { $read.Dispose() }
                      Write-Host "Test log saved to $reports"
                  } catch { Write-Warning "Could not copy emulator log: $_" }
              }
              if (Test-Path -LiteralPath $active) {
                  if (Test-Path -LiteralPath $v8) { throw "__VERSION__ cache already exists unexpectedly: $v8" }
                  Move-Item -LiteralPath $active -Destination $v8 -ErrorAction Stop
              }
              if ($hadOriginal -and (Test-Path -LiteralPath $backup)) {
                  Move-Item -LiteralPath $backup -Destination $active -ErrorAction Stop
                  Write-Host 'Original shader cache restored.'
              }
          }
          '@
          $launcher = $launcher.Replace('__VERSION__', $env:TEST_VERSION)
          Set-Content -Path (Join-Path $bin "Safe-Test-$($env:TEST_VERSION).ps1") -Value $launcher -Encoding UTF8
          @(
            '@echo off',
            'cd /d "%~dp0"',
            ('powershell.exe -NoProfile -ExecutionPolicy Bypass -File "' + '%~dp0Safe-Test-' + $env:TEST_VERSION + '.ps1"'),
            'pause'
          ) | Set-Content -Path (Join-Path $bin "Safe-Test-$($env:TEST_VERSION).cmd") -Encoding ASCII

      - name: Fail if emulator or test launcher is absent
        shell: pwsh
        run: |
          $ver = $env:TEST_VERSION
          foreach ($file in @('build/release/bin/eglantine.exe', "build/release/bin/Safe-Test-$ver.cmd", "build/release/bin/Safe-Test-$ver.ps1")) {
            if (-not (Test-Path $file)) { throw "Build missing $file" }
          }
          Write-Host 'Build package sanity check passed; Zelda gameplay still requires local Intel Arc test.'

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: B570-${{ matrix.version }}-Daily-Isolated-Windows-x64
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 30
