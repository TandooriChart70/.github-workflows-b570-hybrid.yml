
name: B570 Hybrid V3 - Fast Eglantine plus Aubepine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build experimental B570 V3 Windows x64
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PLATFORM: windows-x86_64

    steps:
      - name: Checkout Eglantine source
        uses: actions/checkout@v4
        with:
          repository: Djihads80/Eglantine
          ref: nx2
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate fast source, Zelda fixes, and selected Aubepine/Frizti changes
        id: hybrid
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'B570 Hybrid Experiment'
          git config user.email 'b570-hybrid@users.noreply.github.com'
          git config core.longpaths true

          # Same source baseline as successful Hybrid V1.
          git checkout --detach 70fa082312
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot check out the fast baseline.'
          }

          git switch -c b570-v3-aubepine
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot create V3 branch.'
          }

          # Apply the 11 Zelda rendering corrections.
          git fetch origin '+refs/pull/614/head:refs/remotes/origin/oot-rendering'
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot fetch Zelda PR 614.'
          }

          $renderPatches = @(
            '41e7291', '245d902', '2d29137', '502e6e2',
            'f918505', '8424eeb', '01783ce', 'a6dea8a',
            'dc3e912', '8de2d42', 'b536a97'
          )

          foreach ($sha in $renderPatches) {
            Write-Host "Applying required Zelda patch $sha"
            git cherry-pick -x --empty=drop $sha

            if ($LASTEXITCODE -ne 0) {
              git status --short |
                Out-File -Encoding utf8 integration-error.txt
              throw "Required Zelda rendering patch failed: $sha"
            }
          }

          $v1rev = (git rev-parse HEAD).Trim()

          $applied = [System.Collections.Generic.List[string]]::new()
          $skipped = [System.Collections.Generic.List[string]]::new()

          # Fetch Aubepine source.
          git remote add aubepine https://github.com/pattex67/Aubepine.git

          git fetch --no-tags aubepine '+refs/tags/aubepine-2026-11-05b:refs/tags/b570-aubepine-05b'
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot fetch the Aubepine release tag.'
          }

          $aubref = (git rev-parse 'refs/tags/b570-aubepine-05b^{commit}').Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot resolve Aubepine release commit.'
          }

          $paths = @(git ls-tree -r --name-only $aubref -- pattex/patches)
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot inspect Aubepine patch files.'
          }

          # PATCH 0030 EXCLUDED:
          # Requires GpuSplit.RunOnBack, which is missing in
          # the original fast Eglantine source.
          # Keep the original GPU scheduling implementation.
          $skipped.Add('Aubepine 0030: incompatible GpuSplit API')

          # Apply independent Aubepine rendering improvements.
          foreach ($number in @('0033', '0034', '0038')) {

            $matches = @(
              $paths | Where-Object { $_ -match "/${number}-" }
            )

            if ($matches.Count -ne 1) {
              $skipped.Add("Aubepine ${number}: patch missing")
              continue
            }

            $patchPath = $matches[0]
            $patchFile = Join-Path $env:RUNNER_TEMP "aubepine-${number}.patch"

            git show "${aubref}:$patchPath" > $patchFile

            if ($LASTEXITCODE -ne 0) {
              throw "Cannot read Aubepine patch ${number}."
            }

            $before = (git rev-parse HEAD).Trim()

            Write-Host "Testing Aubepine ${number}: $patchPath"

            git am --3way --empty=drop $patchFile

            if ($LASTEXITCODE -eq 0) {
              $after = (git rev-parse HEAD).Trim()

              if ($after -ne $before) {
                $applied.Add("Aubepine ${number}: $patchPath")
                Write-Host "Applied Aubepine ${number}"
              } else {
                $skipped.Add("Aubepine ${number}: already present")
              }

            } else {
              git am --abort

              if ($LASTEXITCODE -ne 0) {
                throw "Could not abort Aubepine patch ${number}."
              }

              $skipped.Add("Aubepine ${number}: incompatible")
            }
          }

          # Optional Frizti-related improvement.
          git remote add lichii https://github.com/zortos293/Lichii.git

          git fetch --no-tags lichii '+refs/pull/194/head:refs/remotes/lichii/frizti-port'

          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot fetch Frizti-related Lichii PR.'
          }

          git cat-file -e '9218296^{commit}' 2>$null

          if ($LASTEXITCODE -eq 0) {
            $before = (git rev-parse HEAD).Trim()

            git cherry-pick -x --empty=drop 9218296

            if ($LASTEXITCODE -eq 0) {
              $after = (git rev-parse HEAD).Trim()

              if ($after -ne $before) {
                $applied.Add('Frizti preflush cache: 9218296')
              } else {
                $skipped.Add('Frizti preflush cache: already present')
              }

            } else {
              git cherry-pick --abort

              if ($LASTEXITCODE -ne 0) {
                throw 'Cannot abort Frizti patch.'
              }

              $skipped.Add('Frizti preflush cache: incompatible')
            }

          } else {
            $skipped.Add('Frizti preflush cache: unavailable')
          }

          # Verify the source is clean.
          $dirty = @(git status --porcelain)

          if ($dirty.Count -ne 0) {
            throw 'Source tree is not clean after integration.'
          }

          $rev = (git rev-parse HEAD).Trim()

          @(
            'B570 HYBRID V3 - EXPERIMENTAL'
            'Not gameplay verified'
            'Fast Eglantine baseline: 70fa082312'
            "V1 Zelda fixes revision: $v1rev"
            "Aubepine release: $aubref"
            "Final V3 revision: $rev"
            ''
            'Applied additions:'
            $applied
            ''
            'Skipped additions:'
            $skipped
            ''
            'No game, firmware, or keys included.'
          ) | Out-File -Encoding utf8 HYBRID-V3-REPORT.txt

          git diff --stat $v1rev HEAD |
            Out-File -Append -Encoding utf8 HYBRID-V3-REPORT.txt

          if ($applied.Count -eq 0) {
            throw 'No additional patches applied. V3 would duplicate V1.'
          }

          "sha=$rev" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "V3 source ready. Applied $($applied.Count) extra patches."

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B570-V3-source-report
          path: |
            HYBRID-V3-REPORT.txt
            integration-error.txt
          if-no-files-found: ignore

      - name: Setup Eglantine build
        uses: Djihads80/Eglantine/.github/actions/setup-build@5016e217b829b45fda263b05ee00560bd3656397
        with:
          platform: windows-x86_64
          sha: ${{ steps.hybrid.outputs.sha }}
          refspec: b570-fastbase-aubepine-v3
          tag: b570-aubepine-v3-experimental
          release: 'false'

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DNIGHTLY_BUILD=ON

      - name: Compile Windows emulator
        shell: bash
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel 4

      - name: Package Windows emulator
        shell: pwsh
        run: |
          $exe = 'build/release/bin/eglantine.exe'

          if (-not (Test-Path $exe)) {
            throw 'No eglantine.exe was produced.'
          }

          windeployqt --release --no-translations $exe

          if ($LASTEXITCODE -ne 0) {
            throw 'Qt packaging failed.'
          }

          Copy-Item HYBRID-V3-REPORT.txt build/release/bin/

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: B570-Hybrid-V3-Aubepine-Windows-x64
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7
